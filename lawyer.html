<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAQ SAUDI — بوابة المحامين / Lawyer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#001A2C', 800: '#002B49', 700: '#003B63' },
                        emerald: { 600: '#059669', 500: '#10B981' },
                        gold: { 500: '#D4AF37', 400: '#F3E5AB' }
                    },
                    fontFamily: { sans: ['Cairo', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- LAWYER HEADER -->
    <header class="bg-navy-900 border-b border-white/10 px-6 py-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gold-500 text-navy-900 font-bold flex items-center justify-center text-lg shadow-md" id="lawyerAvatar">م</div>
                <div>
                    <h1 class="text-sm font-bold text-white" id="lawyerName">المحامي: جارٍ التحميل...</h1>
                    <p class="text-[10px] text-gold-400 font-mono" id="lawyerLicense">ترخيص وزارة العدل رقم: --/---</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 hover:bg-red-500/20 hover:border-red-500/30 text-slate-300 hover:text-red-400 transition text-xs">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>تسجيل الخروج</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-8 pb-16">
        <!-- LAWYER STATS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="glass-card rounded-2xl p-4 border-r-4 border-gold-500">
                <span class="text-[10px] text-slate-400 uppercase block font-semibold">إجمالي الاستشارات</span>
                <span class="text-xl font-extrabold text-white mt-1 block" id="statTotal">0</span>
            </div>
            <div class="glass-card rounded-2xl p-4 border-r-4 border-amber-500">
                <span class="text-[10px] text-slate-400 uppercase block font-semibold">قضايا بانتظار المراجعة</span>
                <span class="text-xl font-extrabold text-amber-400 mt-1 block" id="statPending">0</span>
            </div>
            <div class="glass-card rounded-2xl p-4 border-r-4 border-emerald-500">
                <span class="text-[10px] text-slate-400 uppercase block font-semibold">استشارات مكتملة</span>
                <span class="text-xl font-extrabold text-emerald-400 mt-1 block" id="statCompleted">0</span>
            </div>
            <div class="glass-card rounded-2xl p-4 border-r-4 border-red-500">
                <span class="text-[10px] text-slate-400 uppercase block font-semibold">حالات عاجلة</span>
                <span class="text-xl font-extrabold text-red-400 mt-1 block" id="statUrgent">0</span>
            </div>
        </div>

        <!-- CASES REVIEW CONTAINER -->
        <div class="glass-card rounded-3xl p-6 border border-white/10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-gold-400"></i>
                    الاستشارات القانونية المحالة إليك
                </h2>
                <button onclick="fetchCases()" class="text-xs text-gold-400 hover:underline flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    تحديث البيانات
                </button>
            </div>

            <!-- CONTAINER LIST ITEM -->
            <div id="casesList" class="space-y-6">
                <!-- Status Loading Default -->
                <div class="p-8 text-center text-slate-400 text-xs">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-gold-400"></i>
                    جارٍ تحميل القضايا والطلبات القانونية...
                </div>
            </div>
        </div>
    </main>

    <!-- Script Konfigurasi & Interaktif -->
    <script src="config.js"></script>
    <script>
        let currentLawyer = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            lucide.createIcons();
            fetchCases();
        });

        function checkAuth() {
            const userRaw = localStorage.getItem('currentUser');
            if (!userRaw) {
                window.location.href = 'login.html';
                return;
            }

            try {
                currentLawyer = JSON.parse(userRaw);
                const role = (currentLawyer.role || '').toUpperCase();
                
                // Hanya LAWYER atau ADMIN yang diizinkan masuk
                if (role !== 'LAWYER' && role !== 'ADMIN' && role !== 'SUPER_ADMIN') {
                    alert('عذراً، هذه البوابة مخصصة للمحامين المعتمدين فقط.');
                    window.location.href = 'index.html';
                    return;
                }

                // Tampilkan Data Pengacara
                document.getElementById('lawyerName').textContent = 'المحامي: ' + (currentLawyer.fullName || 'سليمان الغامدي');
                document.getElementById('lawyerLicense').textContent = 'ترخيص وزارة العدل رقم: ' + (currentLawyer.licenseNo || '41/928');
                document.getElementById('lawyerAvatar').textContent = (currentLawyer.fullName || 'م').charAt(0);
            } catch (e) {
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        async function fetchCases() {
            const container = document.getElementById('casesList');
            container.innerHTML = `
                <div class="p-8 text-center text-slate-400 text-xs">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-gold-400"></i>
                    جارٍ تحميل القضايا والطلبات القانونية...
                </div>
            `;
            lucide.createIcons();

            try {
                const res = await callApi('getLawyerCases', { lawyerId: currentLawyer.userId || currentLawyer.email });
                
                if (res && res.success && Array.isArray(res.cases) && res.cases.length > 0) {
                    renderCases(res.cases);
                    updateStats(res.cases);
                } else {
                    // Jika belum ada data dari backend, pakai fallback data demo
                    const demoCases = [
                        {
                            caseId: 'CASE-8921',
                            title: 'تأخر صرف الرواتب لمدة شهرين',
                            clientName: 'أحمد سوباجيو (Ahmad Subagyo)',
                            questionIndonesian: 'Gaji bulan Juli dan Agustus belum ditransfer ke rekening. Majikan menjanjikan minggu depan namun tidak ada kejelasan...',
                            questionArabic: 'لم يتم تحويل رواتب شهري يوليو وأغسطس إلى الحساب البنكي. الكفيل يعد بأسبوع قادم ولكن لا يوجد توضيح محدد...',
                            status: 'PENDING',
                            isUrgent: false,
                            answerArabic: ''
                        },
                        {
                            caseId: 'CASE-8922',
                            title: 'احتجاز جواز السفر ورفض خروج وعودة',
                            clientName: 'سيتي نورهايزه (Siti Nurhaliza)',
                            questionIndonesian: 'Paspor disimpan oleh kafil dan tidak diizinkan pulang cuti meskipun kontrak kerja sudah berjalan 2 tahun.',
                            questionArabic: 'الجواز محتجز لدى الكفيل ورفض إعطائي خروج وعودة رغم إكمال سنتين في العمل.',
                            status: 'PENDING',
                            isUrgent: true,
                            answerArabic: ''
                        }
                    ];
                    renderCases(demoCases);
                    updateStats(demoCases);
                }
            } catch (err) {
                console.error('Fetch cases error:', err);
                container.innerHTML = `<div class="p-6 text-center text-red-400 text-xs">حدث خطأ أثناء تحميل البيانات من الخادم.</div>`;
            }
        }

        function updateStats(cases) {
            document.getElementById('statTotal').textContent = cases.length;
            document.getElementById('statPending').textContent = cases.filter(c => c.status === 'PENDING').length;
            document.getElementById('statCompleted').textContent = cases.filter(c => c.status === 'COMPLETED').length;
            document.getElementById('statUrgent').textContent = cases.filter(c => c.isUrgent).length;
        }

        function renderCases(cases) {
            const container = document.getElementById('casesList');
            container.innerHTML = '';

            cases.forEach(item => {
                const isCompleted = item.status === 'COMPLETED';
                const card = document.createElement('div');
                card.className = 'p-6 rounded-2xl bg-navy-900 border border-white/10 space-y-4';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${isCompleted ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${isCompleted ? 'تم تقديم الإرشاد' : 'بانتظار المراجعة'}
                            </span>
                            ${item.isUrgent ? '<span class="mr-2 px-2.5 py-1 rounded-full text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30">عاجل</span>' : ''}
                            <h3 class="font-bold text-white text-sm mt-2">${item.title} (العميل: ${item.clientName})</h3>
                        </div>
                        <span class="text-[10px] font-mono text-slate-400">${item.caseId}</span>
                    </div>

                    <!-- ORIGINAL INDONESIAN TEXT & AUTO ARABIC TRANSLATION -->
                    <div class="grid md:grid-cols-2 gap-4 text-xs">
                        <div class="p-4 rounded-xl bg-navy-800/50 border border-white/5">
                            <span class="text-[10px] font-bold text-slate-400 uppercase block mb-1">نص السؤال الأصلي (Bahasa Indonesia):</span>
                            <p class="text-slate-300 leading-relaxed">${item.questionIndonesian}</p>
                        </div>
                        <div class="p-4 rounded-xl bg-gold-500/5 border border-gold-500/20">
                            <span class="text-[10px] font-bold text-gold-400 uppercase block mb-1">الترجمة الآلية الفورية للغة العربية:</span>
                            <p class="text-slate-200 leading-relaxed">${item.questionArabic}</p>
                        </div>
                    </div>

                    <!-- LEGAL ANSWER DRAFTING BOX -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-2">صياغة الإرشاد النظامي (باللغة العربية - سيتم ترجمته آلياً للعمالة):</label>
                        <textarea id="answerInput_${item.caseId}" rows="3" ${isCompleted ? 'disabled' : ''} class="w-full p-4 rounded-xl bg-navy-800 border border-white/10 text-white text-xs outline-none focus:border-gold-500 disabled:opacity-60 disabled:cursor-not-allowed" placeholder="استناداً إلى المادة 90 من نظام العمل السعودي...">${item.answerArabic || ''}</textarea>
                    </div>

                    <div class="flex justify-end gap-3">
                        ${!isCompleted ? `
                            <button id="btnSubmit_${item.caseId}" onclick="submitAnswer('${item.caseId}')" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs hover:bg-emerald-500 transition flex items-center gap-2">
                                <span>اعتماد وإرسال للإندونيسية</span>
                            </button>
                        ` : `
                            <span class="text-xs text-emerald-400 font-semibold flex items-center gap-1">
                                <i data-lucide="check-circle" class="w-4 h-4"></i> تم اعتماد الرأي القانوني وترجمته
                            </span>
                        `}
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        async function submitAnswer(caseId) {
            const answerInput = document.getElementById(`answerInput_${caseId}`);
            const btn = document.getElementById(`btnSubmit_${caseId}`);
            const arabicAnswer = answerInput.value.trim();

            if (!arabicAnswer) {
                alert('الرجاء كتابة الإرشاد النظامي قبل الإرسال');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>جارٍ الاعتماد والترجمة...</span>`;
            lucide.createIcons();

            try {
                const res = await callApi('submitLegalAnswer', {
                    caseId: caseId,
                    answerArabic: arabicAnswer,
                    lawyerId: currentLawyer.userId || currentLawyer.email
                });

                if (res && res.success) {
                    alert('تم اعتماد الإجابة القانونية وترجمتها للغة الإندونيسية بنجاح!');
                    fetchCases();
                } else {
                    alert('فشل حفظ الإجابة: ' + (res?.error?.message || 'حدث خطأ في النظام'));
                    btn.disabled = false;
                    btn.innerHTML = `<span>اعتماد وإرسال للإندونيسية</span>`;
                }
            } catch (err) {
                console.error('Submit answer error:', err);
                alert('حدث خطأ أثناء الاتصال بالخادم.');
                btn.disabled = false;
                btn.innerHTML = `<span>اعتماد وإرسال للإندونيسية</span>`;
            }
        }
    </script>
</body>
</html>
