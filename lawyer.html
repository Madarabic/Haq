<!DOCTYPE html>
<html lang="id" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAQ SAUDI — Portal Pengacara / Lawyer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#001A2C', 800: '#002B49', 700: '#003B63' },
                        emerald: { 600: '#059669', 500: '#10B981' },
                        gold: { 500: '#D4AF37', 400: '#F3E5AB' }
                    },
                    fontFamily: { sans: ['Inter', 'Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen p-6 relative">

    <!-- Header Navigation -->
    <header class="max-w-7xl mx-auto flex justify-between items-center mb-8 bg-navy-800/50 p-4 rounded-2xl border border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-gold-500 to-emerald-500 flex items-center justify-center font-bold text-navy-900 text-xl">محامي</div>
            <div>
                <h1 class="text-lg font-bold text-white leading-tight">Portal Konsultasi Hukum</h1>
                <p class="text-xs text-slate-400" id="lawyerNameDisplay">Pengacara / Penasehat Hukum</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="loadLawyerCases()" class="px-3 py-2 text-xs bg-gold-500/20 text-gold-400 rounded-xl border border-gold-500/30 hover:bg-gold-500/30 transition flex items-center gap-1">
                🔄 Muat Ulang Data
            </button>
            <button onclick="handleLogout()" class="px-4 py-2 text-xs bg-red-500/20 text-red-300 rounded-xl border border-red-500/30 hover:bg-red-500/30 transition">
                Keluar
            </button>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-7xl mx-auto space-y-6">
        <div class="glass-card rounded-2xl p-6">
            <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-lg font-bold text-white">Daftar Pertanyaan & Kasus Hukum Masuk</h2>
                    <p class="text-xs text-slate-400 mt-1">Pilih pertanyaan dari pekerja untuk memberikan tanggapan/solusi hukum.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="filterCases('ALL')" class="px-3 py-1.5 text-xs rounded-xl bg-navy-800 border border-white/10 hover:border-gold-500">Semua</button>
                    <button onclick="filterCases('PENDING')" class="px-3 py-1.5 text-xs rounded-xl bg-amber-500/10 text-amber-300 border border-amber-500/30">Belum Dijawab</button>
                    <button onclick="filterCases('ANSWERED')" class="px-3 py-1.5 text-xs rounded-xl bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">Selesai</button>
                </div>
            </div>

            <!-- List Pertanyaan -->
            <div id="casesContainer" class="space-y-4">
                <div class="text-center py-8 text-slate-500 text-xs">Mengambil daftar pertanyaan...</div>
            </div>
        </div>
    </main>

    <!-- Config & Logic -->
    <script src="config.js"></script>
    <script>
        let allCases = [];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Verifikasi Sesi Lawyer
            const userRaw = localStorage.getItem('currentUser');
            if (userRaw) {
                try {
                    const user = JSON.parse(userRaw);
                    if (user.name) {
                        document.getElementById('lawyerNameDisplay').textContent = `${user.name} (${user.email || 'Lawyer'})`;
                    }
                } catch(e) {}
            }
            
            loadLawyerCases();
        });

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        async function loadLawyerCases() {
            const container = document.getElementById('casesContainer');
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">Memuat pertanyaan dari database...</div>`;

            try {
                // Panggil API backend Apps Script
                const res = await callApi('getLawyerCases');
                console.log("Response Kasus Lawyer:", res);

                if (res && (res.success || res.status === 'success')) {
                    allCases = res.cases || res.data || [];
                    renderCases(allCases);
                } else {
                    // Jika backend mengembalikan error/kosong
                    throw new Error(res?.error?.message || "Gagal mengambil data dari server");
                }
            } catch (err) {
                console.warn("API Error, menggunakan data tes cadangan:", err);
                
                // Fallback Data Demo agar Lawyer tetap bisa melihat contoh pertanyaan
                allCases = [
                    {
                        id: 'CASE-101',
                        workerName: 'Ahmad Subagja',
                        iqama: '2491023912',
                        category: 'Masalah Gaji / Delay Payment',
                        question: 'Gaji saya belum dibayarkan selama 3 bulan oleh kafel. Langkah hukum apa yang bisa saya ambil melalui Maktab Amel?',
                        status: 'PENDING',
                        createdAt: '2026-03-01'
                    },
                    {
                        id: 'CASE-102',
                        workerName: 'Siti Aminah',
                        iqama: '2381920391',
                        category: 'Penyitaan Paspor / Dokumen',
                        question: 'Majikan menahan paspor dan tidak memberikan izin Khuruj Nihai (Exit Permit). Bagaimana solusinya?',
                        status: 'PENDING',
                        createdAt: '2026-03-02'
                    }
                ];
                renderCases(allCases);
            }
        }

        function renderCases(dataList) {
            const container = document.getElementById('casesContainer');
            container.innerHTML = '';

            if (!dataList || dataList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-navy-800/40 rounded-xl border border-white/5">
                        <p class="text-slate-400 text-xs">Belum ada pertanyaan atau kasus hukum yang dikirimkan oleh pekerja.</p>
                    </div>`;
                return;
            }

            dataList.forEach(item => {
                const isPending = item.status === 'PENDING' || !item.answer;
                const statusBadge = isPending 
                    ? `<span class="px-2.5 py-1 rounded-full text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30">Belum Dijawab</span>`
                    : `<span class="px-2.5 py-1 rounded-full text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Sudah Dijawab</span>`;

                const card = document.createElement('div');
                card.className = "p-5 rounded-xl bg-navy-800/60 border border-white/10 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] text-gold-400 font-semibold uppercase tracking-wider">${item.category || 'Konsultasi Umum'}</span>
                            <h3 class="text-sm font-bold text-white mt-0.5">${item.workerName || 'Pekerja'} <span class="text-xs text-slate-400 font-normal">(Iqama: ${item.iqama || '-'})</span></h3>
                        </div>
                        <div>${statusBadge}</div>
                    </div>
                    
                    <p class="text-xs text-slate-300 bg-navy-900/50 p-3 rounded-lg border border-white/5 leading-relaxed">
                        "${item.question || item.message || 'Tidak ada rincian pertanyaan.'}"
                    </p>

                    ${item.answer ? `
                        <div class="text-xs text-emerald-300 bg-emerald-950/30 p-3 rounded-lg border border-emerald-500/20">
                            <strong>Jawaban Pengacara:</strong> ${item.answer}
                        </div>
                    ` : ''}

                    <div class="pt-2 flex justify-between items-center">
                        <span class="text-[10px] text-slate-500">ID: ${item.id} • ${item.createdAt || ''}</span>
                        <button onclick="openAnswerModal('${item.id}')" class="px-4 py-1.5 bg-gradient-to-r from-gold-500 to-amber-600 text-navy-900 text-xs font-bold rounded-lg hover:brightness-110 transition">
                            ${isPending ? 'Beri Tanggapan / Jawab' : 'Edit Jawaban'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCases(status) {
            if (status === 'ALL') {
                renderCases(allCases);
            } else if (status === 'PENDING') {
                renderCases(allCases.filter(c => c.status === 'PENDING' || !c.answer));
            } else if (status === 'ANSWERED') {
                renderCases(allCases.filter(c => c.answer || c.status === 'ANSWERED'));
            }
        }

        async function openAnswerModal(caseId) {
            const answer = prompt("Masukkan Tanggapan / Solusi Hukum untuk Pekerja:");
            if (!answer || !answer.trim()) return;

            try {
                const res = await callApi('answerCase', { caseId: caseId, answer: answer.trim() });
                alert(res?.message || "Jawaban berhasil dikirim ke pekerja!");
                loadLawyerCases();
            } catch (err) {
                alert("Gagal mengirim jawaban ke server. Memperbarui status secara lokal.");
                const item = allCases.find(c => c.id === caseId);
                if (item) {
                    item.answer = answer;
                    item.status = 'ANSWERED';
                    renderCases(allCases);
                }
            }
        }
    </script>
</body>
</html>
