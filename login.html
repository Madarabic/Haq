<!DOCTYPE html>
<html lang="id" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAQ SAUDI — Masuk / เข้าสู่ระบบ / تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#001A2C', 800: '#002B49', 700: '#003B63' },
                        emerald: { 600: '#059669', 500: '#10B981' },
                        gold: { 500: '#D4AF37', 400: '#F3E5AB' }
                    },
                    fontFamily: { sans: ['Inter', 'Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-gold-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-gold-500 to-emerald-500 flex items-center justify-center font-bold text-navy-900 text-2xl shadow-lg shadow-gold-500/20">حق</div>
                <span class="text-2xl font-extrabold tracking-wider text-white">HAQ SAUDI</span>
            </a>
            <h1 class="text-xl font-bold text-white">Masuk ke Portal Resmi</h1>
            <p class="text-xs text-slate-400 mt-1">Silakan pilih akses sesuai peran akun Anda</p>
        </div>

        <div class="glass-card rounded-3xl p-8 shadow-2xl relative">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email / No. HP / ID User</label>
                    <input type="text" id="loginEmail" required placeholder="nama@email.com / 9665x / USR-x" class="w-full px-4 py-3 rounded-xl bg-navy-800/80 border border-white/10 text-white text-xs focus:outline-none focus:border-gold-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi / كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-navy-800/80 border border-white/10 text-white text-xs focus:outline-none focus:border-gold-500 transition">
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-gold-500 to-amber-600 text-navy-900 font-bold rounded-xl shadow-lg hover:brightness-110 transition text-xs mt-2">
                    Masuk Sekarang
                </button>
            </form>

            <!-- DEMO QUICK ACCESS -->
            <div class="mt-8 pt-6 border-t border-white/10">
                <span class="text-[10px] font-bold text-gold-400 uppercase tracking-wider block mb-3 text-center">Akun Demo (Development Mode)</span>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="demoLogin('worker')" class="py-2 px-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-[10px] font-semibold text-slate-300 transition">Demo Pekerja</button>
                    <button onclick="demoLogin('lawyer')" class="py-2 px-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-[10px] font-semibold text-slate-300 transition">Demo Pengacara</button>
                    <button onclick="demoLogin('admin')" class="py-2 px-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-[10px] font-semibold text-slate-300 transition">Demo Admin</button>
                </div>
            </div>
        </div>
        
        <p class="text-center text-xs text-slate-500 mt-6">Belum punya akun? <a href="register.html" class="text-gold-400 hover:underline">Daftar Pekerja Baru</a></p>
    </div>

    <!-- Script Konfigurasi & Interaktif -->
    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const res = await callApi('loginUser', { 
                identifier: identifier,
                email: identifier, 
                password: password 
            });

            if (res.success) {
                // Simpan profil hasil login nyata ke localStorage
                localStorage.setItem('currentUser', JSON.stringify(res.data));

                const role = (res.data.role || '').toUpperCase();
                if (role === 'ADMIN' || role === 'SUPER_ADMIN') {
                    window.location.href = 'admin.html';
                } else if (role === 'LAWYER') {
                    window.location.href = 'lawyer.html';
                } else {
                    window.location.href = 'worker.html';
                }
            } else {
                alert('Login Gagal: ' + (res.error?.message || 'Email/Password salah'));
            }
        }

        function demoLogin(role) {
            let demoUser = {};

            if (role === 'worker') {
                demoUser = {
                    userId: 'USR-0178ac46',
                    fullName: 'Muhamad',
                    email: '966512535123@haqsaudi.internal',
                    role: 'WORKER'
                };
                localStorage.setItem('currentUser', JSON.stringify(demoUser));
                window.location.href = 'worker.html';
            } 
            else if (role === 'lawyer') {
                demoUser = {
                    userId: 'LWY-001',
                    fullName: 'Sulaiman Al-Ghamdi',
                    email: 'sulaiman@law-firm.sa',
                    role: 'LAWYER'
                };
                localStorage.setItem('currentUser', JSON.stringify(demoUser));
                window.location.href = 'lawyer.html';
            } 
            else if (role === 'admin') {
                demoUser = {
                    userId: 'ADM-001',
                    fullName: 'Admin System',
                    email: 'admin@haqsaudi.com',
                    role: 'ADMIN'
                };
                localStorage.setItem('currentUser', JSON.stringify(demoUser));
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
