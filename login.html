<!DOCTYPE html>
<html lang="id" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAQ SAUDI — Masuk / เข้าสู่ระบบ / تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#001A2C', 800: '#002B49', 700: '#003B63' },
                        emerald: { 600: '#059669', 500: '#10B981' },
                        gold: { 500: '#D4AF37', 400: '#F3E5AB' }
                    },
                    fontFamily: { sans: ['Inter', 'Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-gold-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-gold-500 to-emerald-500 flex items-center justify-center font-bold text-navy-900 text-2xl shadow-lg shadow-gold-500/20">حق</div>
                <span class="text-2xl font-extrabold tracking-wider text-white">HAQ SAUDI</span>
            </a>
            <h1 class="text-xl font-bold text-white">Masuk ke Portal Resmi</h1>
            <p class="text-xs text-slate-400 mt-1">Masukkan kredensial akun Anda untuk melanjutkan</p>
        </div>

        <div class="glass-card rounded-3xl p-8 shadow-2xl relative">
            <div id="errorMessage" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-400 text-center"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email / No. HP / ID User / Iqama</label>
                    <input type="text" id="loginEmail" required placeholder="nama@email.com / 2xxxxxxxx / 9665x" class="w-full px-4 py-3 rounded-xl bg-navy-800/80 border border-white/10 text-white text-xs focus:outline-none focus:border-gold-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi / كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-navy-800/80 border border-white/10 text-white text-xs focus:outline-none focus:border-gold-500 transition">
                </div>

                <button type="submit" id="btnLogin" class="w-full py-3.5 bg-gradient-to-r from-gold-500 to-amber-600 text-navy-900 font-bold rounded-xl shadow-lg hover:brightness-110 transition text-xs mt-2">
                    Masuk Sekarang
                </button>
            </form>
        </div>
        
        <p class="text-center text-xs text-slate-500 mt-6">Belum punya akun? <a href="register.html" class="text-gold-400 hover:underline">Daftar Pekerja Baru</a></p>
    </div>

    <!-- Script Konfigurasi & Interaktif -->
    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Auto redirect jika user sudah login sebelumnya
            const userRaw = localStorage.getItem('currentUser');
            if (userRaw) {
                try {
                    const user = JSON.parse(userRaw);
                    redirectUserByRole(user.role);
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        });

        function showError(msg) {
            const errBox = document.getElementById('errorMessage');
            errBox.textContent = msg;
            errBox.classList.remove('hidden');
        }

        function redirectUserByRole(role) {
            const normalizedRole = (role || '').toUpperCase();
            if (normalizedRole === 'ADMIN' || normalizedRole === 'SUPER_ADMIN') {
                window.location.href = 'admin.html';
            } else if (normalizedRole === 'LAWYER') {
                window.location.href = 'lawyer.html';
            } else {
                window.location.href = 'worker.html';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errBox = document.getElementById('errorMessage');
            const identifier = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            try {
                const res = await callApi('loginUser', { 
                    identifier: identifier,
                    email: identifier, 
                    password: password 
                });

                if (res && res.success) {
                    localStorage.setItem('currentUser', JSON.stringify(res.data));
                    redirectUserByRole(res.data.role);
                } else {
                    showError(res?.error?.message || res?.message || 'Kredensial tidak valid. Silakan periksa kembali email/nomor HP dan kata sandi Anda.');
                }
            } catch (err) {
                console.error('Login error:', err);
                showError('Gagal terhubung ke server. Periksa koneksi internet Anda atau pastikan URL Web App Apps Script sudah tepat.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Masuk Sekarang';
            }
        }
    </script>
</body>
</html>
